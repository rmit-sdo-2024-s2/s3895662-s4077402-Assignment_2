name: Foo Application CD Pipeline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  bucket:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Save SSH Private Key
        run: |
          echo "${{ secrets.FOO_SSH_PRIVATE_KEY }}" > infra/foo_ec2_key
          chmod 600 infra/foo_ec2_key

      - name: Save SSH Public Key
        run: |
          echo "${{ secrets.FOO_SSH_PUBLIC_KEY }}" > infra/foo_ec2_key.pub
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install Latest Ansible using pip
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --upgrade ansible
          ansible --version  # Verify the installation
      
      - name: Initialise Terraform
        run: terraform init bucket/

      - name: Validate Terraform
        run: terraform validate bucket/

      - name: Apply Terraform
        run: terraform apply --auto-approve bucket/
  
  infra:
    runs-on: ubuntu-latest
    needs: bucket

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Save SSH Private Key
        run: |
          echo "${{ secrets.FOO_SSH_PRIVATE_KEY }}" > infra/foo_ec2_key
          chmod 600 infra/foo_ec2_key

      - name: Save SSH Public Key
        run: |
          echo "${{ secrets.FOO_SSH_PUBLIC_KEY }}" > infra/foo_ec2_key.pub
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install Latest Ansible using pip
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --upgrade ansible
          ansible --version  # Verify the installation
      
      - name: Initialise Terraform
        run: terraform init infra/

      - name: Validate Terraform
        run: terraform validate infra/

      - name: Plan Terraform
        id: plan
        run: terraform plan -out=tfplan.out infra/

      - name: Check if there are Terraform changes
        id: check_changes
        run: |
          if terraform show -json tfplan.out | jq -e '.resource_changes | length == 0' > /dev/null; then
            echo "no changes"
            echo "::set-output name=changes::false"
          else
            echo "changes detected"
            echo "::set-output name=changes::true"
          fi

      - name: Apply Terraform
        if: steps.check_changes.outputs.changes == 'true'
        run: terraform apply tf.plan.out --auto-approve infra/
  
  ansible:
    runs-on: ubuntu-latest
    needs: infra

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Save SSH Private Key
        run: |
          echo "${{ secrets.FOO_SSH_PRIVATE_KEY }}" > infra/foo_ec2_key
          chmod 600 infra/foo_ec2_key

      - name: Save SSH Public Key
        run: |
          echo "${{ secrets.FOO_SSH_PUBLIC_KEY }}" > infra/foo_ec2_key.pub
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install Latest Ansible using pip
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --upgrade ansible
          ansible --version  # Verify the installation

      - name: Sleep for 30 seconds
        run: |
          echo "The oven is warming up the SSH port...Please wait approximately 30 seconds (sorry)"
          sleep 30

      - name: Run DB playbook
        run: ansible-playbook ansible/db-playbook.yml -i infra/ansible-inventory.yml --private-key=infra/foo_ec2_key

      - name: Run APP playbook
        run: ansible-playbook ansible/app-playbook.yml -i infra/ansible-inventory.yml --private-key=infra/foo_ec2_key

      


